name: Auto Create & Merge Pull Request

on:
  push:
    branches:
      - features
      - 'feature/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create and Merge Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if a PR already exists from head branch to main
          PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --base main --json number --jq '.[0].number')
          
          if [ -z "$PR_NUMBER" ]; then
            echo "Creating new Pull Request..."
            PR_URL=$(gh pr create --title "⚡ Auto PR: Merge ${{ github.ref_name }} into main" --body "Automated Pull Request generated by GitHub Actions workflow." --head "${{ github.ref_name }}" --base main)
            echo "PR created: $PR_URL"
            echo "Merging Pull Request..."
            gh pr merge "$PR_URL" --merge --admin || gh pr merge "$PR_URL" --merge
          else
            echo "Found existing PR #$PR_NUMBER, merging..."
            gh pr merge "$PR_NUMBER" --merge --admin || gh pr merge "$PR_NUMBER" --merge
          fi
