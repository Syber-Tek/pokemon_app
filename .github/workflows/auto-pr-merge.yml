name: Auto Create & Merge Pull Request

on:
  push:
    branches:
      - features
      - 'feature/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create and Merge Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH="${{ github.ref_name }}"
          REPOSITORY="${{ github.repository }}"

          # Determine whether the branch contains commits not present on main.
          AHEAD_BY=$(gh api \
            "repos/${REPOSITORY}/compare/main...${BRANCH}" \
            --jq '.ahead_by')

          if [ "$AHEAD_BY" -eq 0 ]; then
            echo "No commits between main and ${BRANCH}; nothing to merge."
            exit 0
          fi

          PR_NUMBER=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "Creating new Pull Request..."

            PR_URL=$(gh pr create \
              --title "⚡ Auto PR: Merge ${BRANCH} into main" \
              --body "Automated Pull Request generated by GitHub Actions workflow." \
              --head "$BRANCH" \
              --base main)

            echo "PR created: $PR_URL"
            echo "Merging Pull Request..."
            gh pr merge "$PR_URL" --merge --admin || gh pr merge "$PR_URL" --merge
          else
            echo "Found existing PR #$PR_NUMBER, merging..."
            gh pr merge "$PR_NUMBER" --merge --admin || gh pr merge "$PR_NUMBER" --merge
          fi
